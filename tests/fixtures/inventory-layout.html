<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../css/style.css"><link rel="stylesheet" href="../../css/game-menu.css"><style>body{margin:0}.game{width:min(96vw,720px);margin:auto}.menu-screen{display:grid}.inventory-panel{min-height:min(88vh,760px)}</style></head><body class="menu-open inventory-open layout-mobile"><main class="game"><section class="menu-screen"><div class="menu-panel inventory-panel"><h1 class="menu-title">INVENTORY</h1><nav class="inventory-tabs"><button class="is-selected">アイテム</button><button>装備品</button></nav><div class="inventory-list" id="list"></div><div class="inventory-description">HPを20回復する。<br>HPが最大の時は使用できません。</div><div class="inventory-compare" hidden></div><nav class="inventory-pager"><button class="menu-footer">BACK</button><span>1/2</span><button class="menu-footer">NEXT</button></nav></div></section></main><script>const names=['回復薬','解毒剤','導きのたいまつ','退魔の護符','聖水','トレジャーコンパス','回復薬・改','魔法薬','万能薬','帰還の羽'];document.querySelector('#list').replaceChildren(...names.map((name,i)=>{const b=document.createElement('button');b.className='inventory-entry'+(i===0?' is-selected':'')+(i===4?' is-unavailable':'');b.innerHTML=`<span>${name}</span><strong>×${99-i}</strong>`;return b}))</script></body></html>
