<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="/">
<title>開発用 特殊4テーマ</title>
<style>*{box-sizing:border-box}body{background:#161c21;color:#eee;font:15px system-ui;margin:16px}h1{font-size:22px}select,input,button{font:inherit;padding:8px;max-width:100%}form{display:flex;gap:12px;flex-wrap:wrap}input{width:100px}canvas{width:100%;max-width:880px;image-rendering:pixelated}#boss{width:100%;max-width:430px;image-rendering:pixelated;background:repeating-conic-gradient(#333 0% 25%,#222 0% 50%) 0/24px 24px}pre{white-space:pre-wrap;overflow-wrap:anywhere}main{display:flex;flex-wrap:wrap;gap:20px}section{min-width:0;flex:1 1 360px}p{overflow-wrap:anywhere}</style>
<h1>開発用：特殊テーマ／固定ボス</h1><p>明示指定の設計図プレビュー。登録・共有・survey・戦闘には接続しません。</p>
<form><label>theme <select id="theme"><option>gold</option><option>rice</option><option>dusk</option><option>tender</option></select></label><label>Lv <input id="level" value="100" min="1" max="100" type="number"></label><label>floor <select id="floor"><option value="0">B1F</option><option value="1">B2F</option><option value="2">B3F</option></select></label><button>表示</button></form>
<p id="summary"></p><canvas id="view" width="880" height="495"></canvas><main><section><h2 id="boss-name"></h2><img id="boss" alt="固定ボスの元画像"></section><section><pre id="details"></pre></section></main>
<script type="module">
import {generateExplicitSpecialMapV2,describeSpecialThemeMapName} from '/js/special-map/special-themes-v2.js';
import {generateV2EcologyCandidate2} from '/js/special-map/ecology-v2-candidate-2.js';
import {prepareSpecialThemeBoss} from '/js/special-map/boss-presentation.js';
import {loadSpecialMapThemeTextures,useSpecialMapRenderSource,drawCeiling,drawFloor,drawBoundaryWalls} from '/js/renderer.js';
const $=id=>document.getElementById(id);
async function render(){
 window.specialThemePreview=null;
 try{
  const input={ruleset:'special-map-v2',seed:12345,level:Number($('level').value),rarity:'WHITE',themeId:$('theme').value};
  const map=generateExplicitSpecialMapV2(input),f=map.floors[Number($('floor').value)],p=f.stairsUp;
  const canvas=$('view'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
  const restore=useSpecialMapRenderSource({canvas,ctx,W:880,H:495,state:{x:p.x+.5,y:p.y+.5,angle:0,torch:0,shake:0},
   wallOnCell:(x,y,d)=>f.walls[y*10+x]?.[['N','E','S','W'].indexOf(d)]??true,
   inBounds:(x,y)=>x>=0&&y>=0&&x<10&&y<10,getDepth:()=>0,doorTextures:{normal:canvas}},input.themeId);
  let status;
  try{status=await loadSpecialMapThemeTextures(input.themeId);drawCeiling();drawFloor();drawBoundaryWalls();}finally{restore();}
  const presentation=await prepareSpecialThemeBoss(input);
  if(!presentation?.image)throw Error('Boss image unavailable');
  $('boss').src=presentation.boss.image;$('boss-name').textContent=presentation.boss.name;
  const ecology=generateV2EcologyCandidate2(input);
  $('summary').textContent=`${describeSpecialThemeMapName(input).name} / ${input.themeId} B${Number($('floor').value)+1}F / ${status.fallback?'wall fallback: slate':'専用wall 2枚ロード済み'}`;
  $('details').textContent=JSON.stringify({boss:presentation.boss.id,image:presentation.boss.image,colorVariant:false,stats:presentation.boss.scaledStats,ecology:ecology.floors},null,2);
  window.specialThemePreview={map,ecology,status,boss:presentation.boss,imageSize:[presentation.image.naturalWidth,presentation.image.naturalHeight]};
 }catch(error){$('summary').textContent=String(error);window.specialThemeError=String(error);}
}
document.querySelector('form').onsubmit=e=>{e.preventDefault();render();};render();
</script></html>
