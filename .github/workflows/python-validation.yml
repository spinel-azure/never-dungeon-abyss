name: Python Data Validation

on:
  push:
    branches:
      - main
    paths:
      - "data/**"
      - "prototype/card-system/**"
      - "tests/python/**"
      - ".github/workflows/python-validation.yml"
  pull_request:
    branches:
      - main
    paths:
      - "data/**"
      - "prototype/card-system/**"
      - "tests/python/**"
      - ".github/workflows/python-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-game-data:
    name: Validate game data
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: tests/python/requirements.txt

      - name: Install validation dependencies
        run: python -m pip install --requirement tests/python/requirements.txt

      - name: Validate game data
        run: python tests/python/validate_game_data.py
