<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/game-menu.css">
  <title>Quick Status Layout Test</title>
</head>
<body>
  <main style="width:100%;max-width:880px;margin:0 auto;padding:0">
    <div class="quick-status" aria-label="プレイヤー簡易ステータス">
      <span class="quick-identity"><span class="quick-name"><output id="quickName">じゅげむじゅげむ</output><output id="quickNameCompact" class="quick-name-compact">じゅげむじ…</output></span><output id="quickJob">【戦】</output></span>
      <span>LV:<output id="quickLevel">197</output></span>
      <span class="quick-hp">HP <span class="quick-hp-current"><output id="quickHpCurrent">999</output></span>/<output id="quickHpMax">999</output></span>
      <span>SP <output id="quickSpCurrent">999</output>/<output id="quickSpMax">999</output></span>
      <span class="quick-gold"><b>GOLD :</b><output id="quickMoney">999,999</output><b>G</b></span>
    </div>
  </main>
</body>
</html>
