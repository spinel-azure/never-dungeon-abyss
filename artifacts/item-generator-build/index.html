<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NDA アイテム図鑑ジェネレーター</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101820;color:#eef1e6;font:16px/1.7 system-ui,sans-serif}main{max-width:1100px;margin:40px auto;padding:24px}h1{font-size:26px;margin:0}p{color:#a9bac5}.grid{display:grid;grid-template-columns:1fr 340px;gap:30px;margin-top:28px}label{display:block;margin:14px 0 5px}input,textarea,button{font:inherit;border:1px solid #53606c;border-radius:7px}input,textarea{width:100%;padding:10px;background:#1c2832;color:#fff}input[readonly]{color:#b1cad9}textarea{min-height:130px;resize:vertical}button{padding:9px 22px;cursor:pointer;background:#eac16a;color:#182028;margin:12px 8px 0 0}button.secondary{background:#263944;color:#fff}button:disabled{opacity:.45;cursor:default}small{color:#9eb2bc}#count{float:right}.preview{border:1px solid #ae914e;border-radius:10px;padding:24px;background:#080e12;align-self:start;position:sticky;top:24px;overflow-wrap:anywhere}.preview h2{font-size:20px;color:#f1d591;margin:10px 0 20px}.preview p{font-size:14px;margin:8px 0}#pvText{white-space:pre-wrap;color:white;line-height:1.8;font-size:15px;border-top:1px solid #51472e;padding-top:18px;min-height:180px}#status{min-height:28px;color:#edc57c}#output{min-height:230px}#counter.bad{color:#ff9e9e}@media(max-width:760px){main{margin:10px auto;padding:16px}.grid{grid-template-columns:1fr}.preview{position:static;width:min(100%,340px);margin:auto}h1{font-size:22px}}
</style><main><h1>アイテム図鑑ジェネレーター</h1><p>NEVER DUNGEON : ABYSS · ローカル編集用<br><small id="snapshot"></small></p><div class="grid"><form id="form">
<label for="name">① アイテム名</label><input id="name" list="names" autocomplete="off" placeholder="例：強回復薬（中）"><datalist id="names"></datalist><div id="status" role="status"></div>
<label for="itemId">② アイテムID</label><input id="itemId" readonly>
<label for="source">③ 入手方法</label><input id="source"><small>代表的な入手区分。必要に応じて編集できます。</small>
<label for="price">④ 販売価格（G）</label><input id="price" type="number" min="0" step="1" placeholder="非売品は空欄"><small>基本販売価格です。売却額・割引価格ではありません。</small>
<label for="flavor">⑤ 説明文 <span id="count">0 / 90</span></label><textarea id="flavor" placeholder="ここにフレーバーテキストを入力"></textarea><small>最大90文字／推奨60〜80文字。改行も1文字として数えます。</small><br>
<button id="submit" type="submit" disabled>SUBMIT</button><button class="secondary" type="reset">RESET</button>
</form><aside class="preview"><small>図鑑表示のプレビュー（仮）</small><h2 id="pvName">アイテム名</h2><p id="pvSource">入手方法 —</p><p id="pvPrice" hidden></p><div id="pvText">フレーバーテキストがここに表示されます。</div><small>ゲーム内の最終レイアウトとは異なります。</small></aside></div>
<label for="output">出力プロンプト</label><textarea id="output" readonly placeholder="SUBMITすると、コピーして渡せるプロンプトが表示されます。外部へ送信されません。"></textarea><button id="copy" class="secondary" type="button">コピー</button><span id="copyStatus" role="status"></span>
</main><script src="catalog.js"></script><script>
const $=id=>document.getElementById(id), rows=window.NDA_ITEM_CATALOG.items;let selected=null;
const normalize=s=>s.normalize('NFKC').trim();
$('snapshot').textContent=`データ取得：${window.NDA_ITEM_CATALOG.updated} ／ ${rows.length}件（消耗品・素材・貴重品。武器・防具・カードは対象外）`;
for(const row of rows){const o=document.createElement('option');o.value=row.name;o.label=row.kind; $('names').append(o);}
function preview(){const n=Array.from($('flavor').value).length;$('count').textContent=`${n} / 90`;$('count').style.color=n>90?'#ff9393':'';$('submit').disabled=!selected||!$('flavor').value.trim()||n>90||!$('source').value.trim();$('pvName').textContent=selected?.name||'アイテム名';$('pvSource').textContent='入手方法：'+($('source').value||'—');$('pvPrice').hidden=$('price').value==='';$('pvPrice').textContent='価格：'+Number($('price').value).toLocaleString()+'G';$('pvText').textContent=$('flavor').value||'フレーバーテキストがここに表示されます。';}
$('name').addEventListener('input',()=>{const hits=rows.filter(r=>normalize(r.name)===normalize($('name').value));selected=hits.length===1?hits[0]:null;$('itemId').value=selected?.id||'';$('source').value=selected?.source||'';$('price').value=selected?.price??'';$('status').textContent=selected?`${selected.kind}：実装済み`:$('name').value?'一致するアイテムがありません。候補から正式名を選択してください。':'';$('output').value='';preview();});
for(const id of ['source','price','flavor'])$(id).addEventListener('input',()=>{$('output').value='';preview();});
$('form').addEventListener('submit',e=>{e.preventDefault();preview();if($('submit').disabled)return;$('output').value=`NEVER DUNGEON : ABYSSのアイテム図鑑へ、以下の登録内容を反映してください。\n\nアイテム名：${selected.name}\n内部ID：${selected.id}\n入手方法：${$('source').value}\n販売価格：${$('price').value===''?'非売品／設定なし':$('price').value+'G'}\n説明文：\n${$('flavor').value}\n\n既存アイテムのID・性能・入手条件・販売価格は変更せず、図鑑の表示データとして扱ってください。説明文は上記の文言を使用し、表示に必要な改行のみ調整してください。READMEへ個別内容を追記せず、コミット／pushは行わないでください。`;$('copyStatus').textContent='';});
$('form').addEventListener('reset',()=>{selected=null;setTimeout(()=>{$('status').textContent='';$('output').value='';$('copyStatus').textContent='';preview();},0);});
$('copy').addEventListener('click',async()=>{if(!$('output').value)return;try{await navigator.clipboard.writeText($('output').value);$('copyStatus').textContent='コピーしました';}catch{$('output').focus();$('output').select();$('copyStatus').textContent='選択しました。Ctrl+Cでコピーしてください。';}});
</script></html>
